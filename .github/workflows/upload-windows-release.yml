name: Upload Windows Release Installer

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Windows Release Build run ID
        required: true
        type: string
      release_tag:
        description: Existing release tag
        required: true
        type: string

      variant:
        description: Packaged preview backend
        required: true
        type: choice
        options:
          - pdfjs
          - native

permissions:
  actions: read
  contents: write

jobs:
  upload:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      PREVIEW_BACKEND: ${{ inputs.variant }}
    steps:
      - name: Verify build and release
        shell: pwsh
        run: |
          if ($env:BUILD_RUN_ID -notmatch '^\d+$' -or $env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Invalid release inputs' }
          $build = gh api "repos/$env:GH_REPO/actions/runs/$env:BUILD_RUN_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $build.conclusion -ne 'success' -or $build.path -ne '.github/workflows/windows-build.yml') { throw 'Expected a successful Windows release build' }
          $release = gh api "repos/$env:GH_REPO/releases/tags/$env:RELEASE_TAG" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Release does not exist' }
          if ($env:PREVIEW_BACKEND -eq 'pdfjs') {
            $tag = gh api "repos/$env:GH_REPO/git/ref/tags/$env:RELEASE_TAG" | ConvertFrom-Json
            $sha = $tag.object.sha
            if ($tag.object.type -eq 'tag') { $sha = (gh api "repos/$env:GH_REPO/git/tags/$sha" | ConvertFrom-Json).object.sha }
            if ($build.head_sha -ne $sha) { throw 'Standard installer source does not match the release tag' }
          }
          gh release view $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { throw 'Release does not exist' }
      - name: Download verified build installer
        uses: actions/download-artifact@v4
        with:
          name: FreePDF-Windows-${{ inputs.variant }}-Installer
          path: installer
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run_id }}
      - name: Check and upload installer
        shell: pwsh
        run: |
          $suffix = if ($env:PREVIEW_BACKEND -eq 'native') { '_Windows_Native' } else { '' }
          $filename = "FreePDF_$env:RELEASE_TAG$suffix.exe"
          $installer = Get-Item "installer/$filename"
          $stream = $installer.OpenRead()
          try {
            if ($stream.ReadByte() -ne 77 -or $stream.ReadByte() -ne 90 -or $installer.Length -lt 100MB) { throw 'Invalid installer' }
          } finally { $stream.Dispose() }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Output "INSTALLER_SHA256=$hash"
          gh release upload $env:RELEASE_TAG $installer.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
