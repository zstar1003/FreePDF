name: Windows Release Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install uv
          uv pip install --system -r requirements.txt pytest
      - name: Read tracked package variant
        shell: pwsh
        run: |
          $backend = python -c "from utils.build_config import PREVIEW_BACKEND; print(PREVIEW_BACKEND)"
          if ($backend -notin @('pdfjs', 'native')) { throw 'Unknown build variant' }
          "PREVIEW_BACKEND=$backend" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run regression tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q
      - name: Build application
        run: pyinstaller build.spec --clean --noconfirm
      - name: Check packaged dependencies, resources and icon
        run: python tools/check_windows_bundle.py dist/FreePDF $env:PREVIEW_BACKEND
      - name: Check actual packaged rendering and translation process
        run: python tools/smoke_frozen.py dist/FreePDF/FreePDF.exe $env:PREVIEW_BACKEND --translation
      - name: Build NSIS installer
        shell: pwsh
        run: |
          $makensis = Get-Command makensis -ErrorAction SilentlyContinue
          if ($makensis) { $compiler = $makensis.Source }
          else { $compiler = 'C:\Program Files (x86)\NSIS\makensis.exe' }
          if (!(Test-Path $compiler)) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          }
          if ($env:PREVIEW_BACKEND -eq 'native') { & $compiler /DNATIVE_PREVIEW installer.nsi }
          else { & $compiler installer.nsi }
          if ($LASTEXITCODE -ne 0) { throw 'NSIS compilation failed' }
      - name: Check installed application from a path containing spaces
        shell: pwsh
        run: |
          $installer = (Get-Item FreePDF_v*.exe).FullName
          $target = Join-Path $env:RUNNER_TEMP 'Free PDF Installed/FreePDF'
          $process = Start-Process $installer -ArgumentList @('/S', "/D=$target") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Installer failed' }
          python tools/smoke_frozen.py "$target/FreePDF.exe" $env:PREVIEW_BACKEND --translation
          if ($LASTEXITCODE -ne 0) { throw 'Installed PDF rendering failed' }
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: FreePDF-Windows-${{ env.PREVIEW_BACKEND }}-Installer
          path: FreePDF_v*.exe
          if-no-files-found: error
          retention-days: 14
