name: Windows Release Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install uv
          uv pip install --system -r requirements.txt pytest
      - name: Run regression tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q
      - name: Build application
        run: pyinstaller build.spec --clean --noconfirm
      - name: Check native preview dependencies and icon
        shell: pwsh
        run: |
          $required = @('PyQt6/Qt6/bin/Qt6Pdf.dll', 'PyQt6/Qt6/bin/Qt6PdfWidgets.dll', 'ui/logo/logo.png')
          foreach ($relative in $required) {
            if (!(Test-Path "dist/FreePDF/_internal/$relative")) { throw "Missing packaged resource: $relative" }
          }
          if (Get-ChildItem dist/FreePDF -Recurse -Filter '*WebEngine*') { throw 'Windows package unexpectedly depends on WebEngine' }
      - name: Check packaged startup
        run: python tools/smoke_frozen.py dist/FreePDF/FreePDF.exe
      - name: Build NSIS installer
        shell: pwsh
        run: |
          $makensis = Get-Command makensis -ErrorAction SilentlyContinue
          if ($makensis) { $compiler = $makensis.Source }
          else { $compiler = 'C:\Program Files (x86)\NSIS\makensis.exe' }
          if (!(Test-Path $compiler)) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          }
          & $compiler installer.nsi
          if ($LASTEXITCODE -ne 0) { throw 'NSIS compilation failed' }
      - name: Check installed application from a path containing spaces
        shell: pwsh
        run: |
          $installer = (Get-Item FreePDF_v*.exe).FullName
          $target = Join-Path $env:RUNNER_TEMP 'Free PDF Installed/FreePDF'
          $process = Start-Process $installer -ArgumentList @('/S', "/D=$target") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Installer failed' }
          python tools/smoke_frozen.py "$target/FreePDF.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Installed PDF rendering failed' }
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: FreePDF-Windows-Installer
          path: FreePDF_v*.exe
          if-no-files-found: error
          retention-days: 14
